<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Ngọc Giàu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,600;0,800;1,800&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1018;--gold:#f0d79a;--ink:#eef2f6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Lora',Georgia,serif}
#c,#p{position:fixed;inset:0;width:100%;height:100%}
#cat{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 1s;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1d3f49aa,#0a1018ee 75%)}
#cat.on{opacity:1}
.cc{--w:min(74vw,310px);position:relative;width:var(--w);height:var(--w);transform:scale(.5) rotate(-6deg);transition:transform .8s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 14px 28px #0009)}
#cat.pop .cc{transform:none;animation:sway 3s ease-in-out .9s infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.cc svg{width:100%;height:100%;display:block}
.hb{position:absolute;left:7%;top:7%;transform:rotate(-8deg);font:800 calc(var(--w)*.085) 'Be Vietnam Pro',sans-serif;line-height:1.1;text-shadow:0 2px 0 #0002}
.hb span{display:inline-block;animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.b1{animation:bob .55s ease-in-out infinite alternate}.b2{animation:bob .55s ease-in-out .27s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.mo{transform-box:fill-box;transform-origin:50% 0;animation:mo .5s ease-in-out infinite alternate}
@keyframes mo{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.2)}}
#s2{position:fixed;inset:0;opacity:0;transition:opacity 1.8s;pointer-events:none}
#s2.on{opacity:1}
#ph{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;top:100%;width:clamp(120px,30vw,190px);height:auto;border-radius:10px;border:5px solid #f4efe3;box-shadow:0 12px 30px #0009;animation:up linear forwards}
.sp{position:absolute;top:100%;color:var(--gold);animation:up linear forwards;opacity:.8}
@keyframes up{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-135vh) rotate(calc(var(--r,0deg) * -1))}}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,460px);padding:28px 24px 30px;background:#0a1018c2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #f0d79a55;border-radius:18px;text-align:center}
h1{font:800 1.5rem 'Be Vietnam Pro',sans-serif;color:var(--gold);min-height:2rem;margin-bottom:14px}
#msg{font-size:1.05rem;line-height:1.75;min-height:11.5rem;text-align:left}
#end{font:italic 800 1.6rem 'Be Vietnam Pro',sans-serif;color:var(--gold);margin-top:14px;opacity:0;transition:opacity 1.5s}
#end.on{opacity:1}
#re{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:auto;background:none;border:1px solid #f0d79a66;color:var(--gold);border-radius:20px;padding:7px 14px;font:600 .8rem 'Be Vietnam Pro',sans-serif;opacity:0;transition:opacity 1s}
#re.on{opacity:1}
</style>
</head>

  </svg>

const $=id=>document.getElementById(id);
const c=$('c'),x=c.getContext('2d'),pc=$('p'),g2=pc.getContext('2d');
const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',fs=14,N=4200;
let W,H,cols,drops,parts=[],pa=1,phase=1,fade=0;
const FONT=s=>'italic 800 '+s+'px "Be Vietnam Pro",sans-serif';
function init(){
  W=c.width=pc.width=innerWidth;H=c.height=pc.height=innerHeight;cols=Math.ceil(W/fs);
  drops=Array.from({length:cols},()=>Math.random()*-40);
}
init();addEventListener('resize',()=>{if(phase==1)init()});
function mk(){parts=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,tx:Math.random()*W,ty:Math.random()*H,on:0,s:Math.random()}));}
function shape(lines,fw,fh){
  const m=document.createElement('canvas');m.width=W;m.height=H;const g=m.getContext('2d');
  g.textAlign='center';g.textBaseline='middle';g.font=FONT(100);
  const wm=Math.max(...lines.map(s=>g.measureText(s).width));
  const size=Math.min(100*fw/wm,fh/(lines.length*1.2),230);
  g.font=FONT(size);g.fillStyle='#fff';
  lines.forEach((s,i)=>g.fillText(s,W/2,H/2+(i-(lines.length-1)/2)*size*1.2));
  const d=g.getImageData(0,0,W,H).data,st=size>150?4:3,pts=[];
  for(let y=0;y<H;y+=st)for(let xx=0;xx<W;xx+=st)if(d[(y*W+xx)*4+3]>128)pts.push([xx+Math.random()*2,y+Math.random()*2]);
  for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
  return pts;
}
function form(lines,fw,fh){
  const pts=shape(lines,fw,fh);
  parts.forEach((p,i)=>{if(i<pts.length){p.tx=pts[i][0];p.ty=pts[i][1];p.on=1;}else{p.on=0;p.tx=Math.random()*W;p.ty=Math.random()*H;}});
}
function burst(){parts.forEach(p=>{const a=Math.random()*6.283,v=8+Math.random()*30;p.vx+=Math.cos(a)*v;p.vy+=Math.sin(a)*v;});}
function scatter(){parts.forEach(p=>{const a=Math.random()*6.283,r=Math.max(W,H)*(.3+Math.random()*.6);p.tx=W/2+Math.cos(a)*r;p.ty=H/2+Math.sin(a)*r;});fade=1;}
function draw(){
  x.fillStyle='rgba(10,16,24,'+(phase==1?.14:.22)+')';x.fillRect(0,0,W,H);
  x.font=fs+'px monospace';x.fillStyle=phase==1?'#7fcfc6':'#3f8f8a';
  for(let i=0;i<cols;i++){
    const y=drops[i]*fs;x.fillText(L[Math.random()*26|0],i*fs,y);
    if(y>H&&Math.random()>.975)drops[i]=0;drops[i]+=.55;
  }
  g2.clearRect(0,0,W,H);
  if(parts.length){
    if(fade){pa=Math.max(0,pa-.017);if(!pa)fade=0;}
    const t=performance.now()/1000,sz=W<600?2.2:2.8;
    for(const p of parts){
      const k=p.on?.05:.003;
      p.vx=(p.vx+(p.tx-p.x)*k)*.84;p.vy=(p.vy+(p.ty-p.y)*k)*.84;
      p.x+=p.vx;p.y+=p.vy;
      if(p.on){p.x+=Math.sin(t*3+p.s*40)*.25;p.y+=Math.cos(t*2.6+p.s*30)*.25;}
      g2.globalAlpha=pa*(p.on?1:.25);
      g2.fillStyle=p.on?(p.s<.3?'#ffffff':'#f0d79a'):'#7fcfc6';
      g2.fillRect(p.x,p.y,sz,sz);
    }
  }
  requestAnimationFrame(draw);
}
function type(el,s,ms,cb){let i=0;(function f(){el.textContent=s.slice(0,++i);if(i<s.length)setTimeout(f,ms);else cb&&cb();})();}
function catScene(){
  const el=$('cat');el.classList.add('on');setTimeout(()=>el.classList.add('pop'),200);
  const iv=setInterval(()=>{
    const s=document.createElement('span');s.className='sp';s.textContent='✦';
    s.style.left=Math.random()*100+'%';s.style.fontSize=(10+Math.random()*14)+'px';
    s.style.animationDuration=(4+Math.random()*3)+'s';s.onanimationend=()=>s.remove();el.appendChild(s);
  },300);
  setTimeout(()=>{clearInterval(iv);el.classList.remove('on');scene2();},5800);
}
function scene2(){
  $('s2').classList.add('on');
  const box=$('ph');let k=0;
  function photo(){
    const im=new Image();im.src=P[k++%P.length];im.className='ph';
    const w=Math.min(190,Math.max(120,innerWidth*.3));
    im.style.left=Math.random()*(innerWidth-w)+'px';
    im.style.setProperty('--r',(Math.random()*12-6)+'deg');
    im.style.animationDuration=(10+Math.random()*4)+'s';
    im.onanimationend=()=>im.remove();box.appendChild(im);
  }
  function spark(){
    const s=document.createElement('span');s.className='sp';s.textContent='✦';
    s.style.left=Math.random()*100+'%';s.style.fontSize=(8+Math.random()*12)+'px';
    s.style.animationDuration=(6+Math.random()*6)+'s';s.onanimationend=()=>s.remove();box.appendChild(s);
  }
  photo();setTimeout(photo,1500);setTimeout(photo,3200);
  setInterval(photo,2600);setInterval(spark,450);
  setTimeout(()=>type($('nm'),'Chào Ngọc Giàu',70,()=>{
    type($('msg'),'Mong bạn tuổi mới luôn khoẻ mạnh, tràn đầy tích cực, vui vẻ, tự tin, yêu đời và thành công trên con đường đã chọn. Tuy mình không biết nói gì nhiều, nhưng thật lòng đấy.',42,()=>{
      $('end').classList.add('on');$('re').classList.add('on');
    });
  }),1200);
}
// chữ HAPPY BIRTHDAY nhiều màu trên khung mèo
const cl=['#ff6b81','#ffb02e','#4cc9a0','#6cb4f0','#b48cf0'];let ci=0;
['HAPPY','BIRTHDAY'].forEach(w=>{const d=document.createElement('div');
  [...w].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.color=cl[ci++%5];s.style.animationDelay=(i*.08)+'s';d.appendChild(s);});
  $('hb').appendChild(d);});
function start(){
  draw();mk();
  const m=Math.min(W,H);
  const T=[
    [900,()=>form(['3'],W*.8,H*.5)],
    [2100,()=>form(['2'],W*.8,H*.5)],
    [3300,()=>form(['1'],W*.8,H*.5)],
    [4500,()=>{burst();form(W<700?['Happy','Birthday!']:['Happy Birthday!'],W*.86,H*.5);}],
    [8800,scatter],
    [9600,()=>{phase=2;catScene();}]
  ];
  T.forEach(([ms,f])=>setTimeout(f,ms));
}
let started=false;const go=()=>{if(!started){started=true;start();}};
Promise.race([document.fonts.load('italic 800 60px "Be Vietnam Pro"'),new Promise(r=>setTimeout(r,1800))]).then(go,go);
